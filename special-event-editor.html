<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Special Event Editor — BVSW Math NHS</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/math-nhs-logo.png"><link rel="stylesheet" href="assets/style.css"><style>html,body{height:100%;margin:0}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:var(--white);box-sizing:border-box}.topbar a{text-decoration:none}iframe{display:block;width:100%;height:calc(100% - 58px);border:0;background:var(--pale)}</style></head><body><div class="topbar"><strong>Special event editor</strong><div><a class="btn btn-outline" href="quick-content.html">← Quick editor</a></div></div><iframe id="portalFrame" src="legacy-portal.html" title="Special event editor"></iframe><script>
const frame=document.getElementById('portalFrame');function focusEventEditor(){try{const d=frame.contentDocument;if(!d)return;const tabs=d.querySelector('.portal-tabs');if(tabs)tabs.style.display='none';['portalPanelMeetings','portalPanelWork','portalPanelContent'].forEach(id=>{const e=d.getElementById(id);if(e)e.hidden=true});const upcoming=d.getElementById('portalPanelUpcoming');if(upcoming)upcoming.hidden=false;const admin=d.getElementById('adminView');if(admin&&admin.style.display!=='none'){const b=d.querySelector('[data-portal-tab="upcoming"]');if(b&&!upcoming?.dataset.quickOpened){b.click();if(upcoming)upcoming.dataset.quickOpened='1'}}}catch{}}
frame.addEventListener('load',()=>{focusEventEditor();setInterval(focusEventEditor,500)});
</script></body></html>
