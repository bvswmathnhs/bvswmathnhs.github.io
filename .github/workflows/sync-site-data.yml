name: Sync site data

# Keeps assets/site-data.json and assets/meetings-data.json (same-origin fallbacks for networks that block supabase.co) in sync with the database.
# Also makes a tiny keep-alive commit if the repo has been quiet for 40+ days, so GitHub never pauses the schedule.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [site-content-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest site_content
        run: |
          KEY="sb_publishable_nCmsqkpfcczNuWV4MH8IKQ_cWnnfnzI"
          curl -fsS "https://rydpwtehxjgmshpaxlbj.supabase.co/rest/v1/site_content?select=*&id=eq.1&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | jq '.[0]' > /tmp/site-data.json
          test "$(jq -r .id /tmp/site-data.json)" = "1"
      - name: Fetch meeting notes and current slides
        # Non-fatal: if this fails, the site_content sync below still runs.
        continue-on-error: true
        run: |
          KEY="sb_publishable_nCmsqkpfcczNuWV4MH8IKQ_cWnnfnzI"
          BASE="https://rydpwtehxjgmshpaxlbj.supabase.co/rest/v1"
          curl -fsS "$BASE/meeting_notes?select=meeting_date,title,description,links&order=meeting_date.desc,id.desc" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /tmp/notes.json
          curl -fsS "$BASE/current_slides?select=embed_url&id=eq.1&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /tmp/slides.json
          jq -n --slurpfile n /tmp/notes.json --slurpfile s /tmp/slides.json \
            '{meeting_notes: $n[0], current_slides: ($s[0][0] // null)}' > /tmp/meetings-data.new
          test "$(jq -r '.meeting_notes | type' /tmp/meetings-data.new)" = "array"
          mv /tmp/meetings-data.new /tmp/meetings-data.json
      - name: Commit if changed, or keep the schedule alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          if ! cmp -s /tmp/site-data.json assets/site-data.json; then
            cp /tmp/site-data.json assets/site-data.json
            git add assets/site-data.json
            changed=1
          fi
          if [ -s /tmp/meetings-data.json ] && ! cmp -s /tmp/meetings-data.json assets/meetings-data.json; then
            cp /tmp/meetings-data.json assets/meetings-data.json
            git add assets/meetings-data.json
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git commit -m "Sync site data from Supabase"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3456000 ]; then
            git commit --allow-empty -m "Keep scheduled sync alive"
            git push
          fi
