name: Sync site data

# Keeps assets/site-data.json (same-origin fallback for networks that block supabase.co) in sync with the database.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest site_content
        run: |
          KEY="sb_publishable_nCmsqkpfcczNuWV4MH8IKQ_cWnnfnzI"
          curl -fsS "https://rydpwtehxjgmshpaxlbj.supabase.co/rest/v1/site_content?select=*&id=eq.1&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | jq '.[0]' > /tmp/site-data.json
          test "$(jq -r .id /tmp/site-data.json)" = "1"
      - name: Commit if changed
        run: |
          if ! cmp -s /tmp/site-data.json assets/site-data.json; then
            cp /tmp/site-data.json assets/site-data.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/site-data.json
            git commit -m "Sync site data from Supabase"
            git push
          fi
